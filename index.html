<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#262B1D">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ang. Paszport">
<meta name="format-detection" content="telephone=no">
<title>Angielski Paszport — STANAG 6001</title>
<style>
  :root{
    --ink:#211F1A;
    --paper:#C7BF9F;
    --paper-dark:#B6AC85;
    --paper-darker:#A2966C;
    --card:#F1ECDC;
    --navy:#262B1D;
    --navy-light:#333B24;
    --teal:#54615A;
    --teal-dark:#3A443D;
    --amber:#C1440E;
    --amber-light:#DE6A2E;
    --stamp:#7E1F1F;
    --rust:#7E1F1F;
    --good:#48592B;
    --line:rgba(33,31,26,0.24);
    --font-display: 'Arial Black', 'Franklin Gothic Bold', 'Haettenschweiler', 'Segoe UI', sans-serif;
    --font-body: 'Bahnschrift', 'Segoe UI', Roboto, Arial, sans-serif;
    --font-mono: 'Consolas', 'SF Mono', 'Courier New', monospace;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background-color:var(--paper);
    background-image:
      repeating-linear-gradient(0deg, rgba(33,31,26,0.05) 0 1px, transparent 1px 24px),
      repeating-linear-gradient(90deg, rgba(33,31,26,0.05) 0 1px, transparent 1px 24px);
    color:var(--ink); font-family:var(--font-body); line-height:1.5; min-height:100vh;
  }
  @media (prefers-reduced-motion: reduce){ *{animation-duration:0.001ms !important; transition-duration:0.001ms !important;} }
  a{color:inherit;}
  button{font-family:inherit;}

  header.top{background:var(--navy); color:var(--paper); padding:22px 18px 26px; position:relative; overflow:hidden;
    background-image:repeating-linear-gradient(135deg, rgba(255,255,255,0.025) 0 2px, transparent 2px 14px);
    border-bottom:3px solid var(--ink);}
  header.top::after{content:""; position:absolute; left:0; right:0; bottom:-3px; height:7px;
    background:repeating-linear-gradient(-45deg, var(--amber) 0 12px, var(--ink) 12px 24px); opacity:.9;}
  .top-inner{max-width:980px; margin:0 auto; display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap;}
  .brand{display:flex; align-items:center; gap:14px; cursor:pointer;}
  .brand-mark{width:46px;height:50px;
    clip-path:polygon(50% 0%, 100% 16%, 100% 62%, 50% 100%, 0% 62%, 0% 16%);
    background:linear-gradient(160deg, var(--teal) 0%, var(--navy-light) 100%);
    border:2px solid var(--amber-light);
    display:flex;align-items:center;justify-content:center; font-family:var(--font-display); font-weight:900; font-size:15px;
    letter-spacing:.5px; color:var(--paper); flex-shrink:0;}
  .brand h1{font-family:var(--font-display); font-size:21px; margin:0; letter-spacing:1.5px; font-weight:900; text-transform:uppercase;}
  .brand p{margin:3px 0 0; font-size:11px; letter-spacing:2px; text-transform:uppercase; color:var(--amber-light); opacity:.95; font-family:var(--font-mono);}
  .stats-chip{font-family:var(--font-mono); background:var(--navy-light); border:1px solid var(--amber); color:var(--paper);
    border-radius:3px; padding:8px 16px; font-size:12.5px; white-space:nowrap; letter-spacing:.5px;}

  main{max-width:980px; margin:0 auto; padding:28px 18px 80px;}

  .crumbs{display:flex; align-items:center; gap:6px; font-size:11.5px; color:var(--teal-dark); margin-bottom:14px; flex-wrap:wrap;
    font-family:var(--font-mono); text-transform:uppercase; letter-spacing:.5px;}
  .crumbs button{background:none;border:none;color:var(--amber); font-weight:700; cursor:pointer; font-size:11.5px; padding:0; font-family:var(--font-mono);}
  .crumbs button:hover{text-decoration:underline;}

  .intro{margin-bottom:26px;}
  .intro h2{font-family:var(--font-display); font-size:24px; margin:0 0 8px; text-transform:uppercase; letter-spacing:1px;}
  .intro p{margin:0; color:#40453A; max-width:65ch;}

  .level-grid{display:grid; grid-template-columns:1fr 1fr; gap:16px;}
  @media (max-width:640px){ .level-grid{grid-template-columns:1fr;} }
  .level-card{background:var(--card); border:1.5px solid var(--ink); border-radius:3px; padding:24px; cursor:pointer;
    transition:transform .15s ease, box-shadow .15s ease; position:relative; overflow:hidden;
    box-shadow:5px 5px 0 rgba(33,31,26,0.12);}
  .level-card:hover{transform:translate(-2px,-2px); box-shadow:7px 7px 0 rgba(33,31,26,0.18);}
  .level-card:focus-visible{outline:3px solid var(--amber); outline-offset:2px;}
  .level-card::before, .level-card::after{content:""; position:absolute; top:10px; width:7px; height:7px; border-radius:50%;
    background:radial-gradient(circle at 35% 35%, #dcd6c0, var(--teal-dark)); box-shadow:inset 0 0 0 1px rgba(0,0,0,.3);}
  .level-card::before{left:10px;}
  .level-card::after{right:10px;}
  .level-card .spj{font-family:var(--font-mono); font-size:11.5px; letter-spacing:2px; color:var(--amber); text-transform:uppercase; font-weight:700;}
  .level-card h3{font-family:var(--font-display); font-size:22px; margin:8px 0 4px; text-transform:uppercase; letter-spacing:.5px;}
  .level-card .cefr{font-size:12px; color:var(--teal-dark); margin-bottom:10px; font-family:var(--font-mono);}
  .level-card p.desc{font-size:13.5px; color:#40453A; margin:0 0 16px;}
  .level-card .lvl-progress{display:flex; align-items:center; gap:10px;}
  .lvl-bar{flex:1; height:8px; border-radius:2px; background:var(--paper-darker); overflow:hidden; border:1px solid var(--ink);}
  .lvl-bar-fill{height:100%; background:repeating-linear-gradient(-45deg, var(--amber) 0 6px, var(--amber-light) 6px 12px);}
  .lvl-progress .pct{font-family:var(--font-mono); font-size:12px; color:var(--teal-dark); min-width:34px; text-align:right; font-weight:700;}
  .level-card .ring{display:none;}

  .reset-row{margin-top:30px; text-align:center;}
  .link-btn{background:none;border:none;color:var(--teal-dark);font-size:11.5px; text-decoration:underline; cursor:pointer; padding:6px; font-family:var(--font-mono); text-transform:uppercase; letter-spacing:.5px;}

  .module-header{margin-bottom:18px;}
  .module-header .eyebrow{font-family:var(--font-mono); font-size:11.5px; letter-spacing:2px; text-transform:uppercase; color:var(--amber); font-weight:700;}
  .module-header h2{font-family:var(--font-display); font-size:25px; margin:5px 0 2px; text-transform:uppercase; letter-spacing:.5px;}

  .tabs{display:flex; gap:3px; border-bottom:3px solid var(--ink); margin-bottom:22px; overflow-x:auto;}
  .tab-btn{background:var(--paper-dark); border:1px solid var(--ink); border-bottom:none; cursor:pointer; padding:10px 14px; font-size:12px; font-weight:700;
    color:var(--teal-dark); display:flex; align-items:center; gap:6px; white-space:nowrap; text-transform:uppercase; letter-spacing:.5px;
    border-radius:3px 3px 0 0; margin-bottom:-3px;}
  .tab-btn.active{color:var(--card); background:var(--navy); border-color:var(--ink);}
  .tab-dot{width:7px;height:7px;border-radius:50%; background:var(--paper-darker); border:1px solid var(--ink);}
  .tab-dot.done{background:var(--amber); border-color:var(--amber);}

  .panel{display:none;}
  .panel.active{display:block; animation:fadein .25s ease;}
  @keyframes fadein{from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:none;}}

  .primary-btn{background:var(--amber); color:#fff; border:1.5px solid var(--ink); border-radius:3px; padding:12px 24px;
    font-size:13px; font-weight:800; cursor:pointer; letter-spacing:1px; text-transform:uppercase; box-shadow:3px 3px 0 rgba(33,31,26,.25);}
  .primary-btn:hover{background:var(--amber-light); transform:translate(-1px,-1px); box-shadow:4px 4px 0 rgba(33,31,26,.3);}
  .primary-btn:disabled{opacity:.4; cursor:not-allowed; box-shadow:none; transform:none;}
  .ghost-btn{background:var(--card); color:var(--teal-dark); border:1.5px solid var(--teal-dark); border-radius:3px;
    padding:11px 22px; font-size:13px; font-weight:800; cursor:pointer; text-transform:uppercase; letter-spacing:1px;}
  .ghost-btn:hover{background:var(--teal-dark); color:var(--card);}
  .ghost-btn:disabled{opacity:.4; cursor:not-allowed;}
  .small-btn{background:var(--card); border:1.5px solid var(--ink); border-radius:3px; padding:7px 13px; font-size:11.5px; font-weight:700; cursor:pointer; color:var(--ink); text-transform:uppercase; letter-spacing:.5px;}
  .small-btn:hover{border-color:var(--amber); color:var(--amber);}
  .icon-btn{background:var(--card); border:1.5px solid var(--ink); border-radius:3px; width:42px;height:42px;
    display:flex; align-items:center; justify-content:center; cursor:pointer; font-size:16px; color:var(--ink);}
  .icon-btn:hover{background:var(--paper-dark);}
  .icon-btn:disabled{opacity:.35; cursor:not-allowed;}

  /* ---- Grammar module ---- */
  .section-lbl{font-family:var(--font-mono); font-size:11.5px; letter-spacing:2px; text-transform:uppercase; color:var(--card); margin:30px 0 14px;
    background:var(--navy); display:inline-block; padding:6px 14px; border-radius:2px; font-weight:700;}
  .section-lbl:first-child{margin-top:0;}
  .tense-card{background:var(--card); border:1.5px solid var(--ink); border-left:6px solid var(--amber); border-radius:3px; padding:20px 22px; margin-bottom:14px;}
  .tense-head{display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap; margin-bottom:10px;}
  .tense-head h4{margin:0; font-family:var(--font-display); font-size:17px; text-transform:uppercase; letter-spacing:.5px;}
  .tense-head .pl{font-family:var(--font-body); font-weight:400; font-size:13px; color:#5a5f52; text-transform:none; letter-spacing:0;}
  .tense-block-lbl{font-size:11px; font-weight:800; text-transform:uppercase; letter-spacing:1px; color:var(--amber); margin:14px 0 6px; font-family:var(--font-mono);}
  .tense-block-lbl:first-of-type{margin-top:0;}
  .usage-list{margin:0; padding-left:18px; font-size:13.5px;}
  .usage-list li{margin-bottom:4px;}
  .struct-table{width:100%; border-collapse:collapse; font-size:13px;}
  .struct-table td{padding:7px 8px; border-bottom:1px solid var(--line); vertical-align:top;}
  .struct-table td:first-child{font-weight:800; width:110px; color:var(--teal-dark); text-transform:uppercase; font-size:11.5px; letter-spacing:.5px;}
  .struct-table .formula{font-family:var(--font-mono); font-size:12px;}
  .struct-table .ex{font-style:italic; color:#4a5248;}
  .tag-list{display:flex; flex-wrap:wrap; gap:6px;}
  .tag-chip{background:var(--paper); border:1px solid var(--ink); border-radius:2px; padding:4px 11px; font-size:12px; font-family:var(--font-mono);}
  .phrase-mini{margin:0; padding-left:18px; font-size:13px;}
  .phrase-mini li{margin-bottom:3px;}
  .tense-foot{margin-top:14px; padding-top:12px; border-top:1px dashed var(--line); text-align:right;}

  .ref-table{width:100%; border-collapse:collapse; background:var(--card); border:1.5px solid var(--ink); border-radius:3px; overflow:hidden; font-size:13px;}
  .ref-table th{background:var(--navy); color:var(--card); text-align:left; padding:9px 12px; font-size:11px; text-transform:uppercase; letter-spacing:1px; font-weight:700; font-family:var(--font-mono);}
  .ref-table td{padding:8px 12px; border-bottom:1px solid var(--line);}
  .ref-table tr:last-child td{border-bottom:none;}
  .ref-table-wrap{overflow-x:auto; margin-bottom:18px;}
  .vocab-cat{background:var(--card); border:1.5px solid var(--ink); border-radius:3px; padding:16px 18px; margin-bottom:12px;}
  .vocab-cat h5{margin:0 0 8px; font-family:var(--font-display); font-size:14px; text-transform:uppercase; letter-spacing:.5px;}
  .vocab-chips{display:flex; flex-wrap:wrap; gap:8px;}
  .vocab-chip{background:var(--paper); border:1px solid var(--line); border-radius:2px; padding:6px 10px; font-size:12.5px;}
  .vocab-chip b{font-weight:700;}

  .quiz-topic-btns{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:20px;}
  .quiz-topic-btn{background:var(--card); border:1.5px solid var(--ink); border-radius:3px; padding:9px 16px; font-size:12px; font-weight:700; cursor:pointer; text-transform:uppercase; letter-spacing:.5px;}
  .quiz-topic-btn:hover{border-color:var(--amber); color:var(--amber);}
  .quiz-topic-btn.active{background:var(--amber); border-color:var(--ink); color:#fff;}
  .quiz-best{font-family:var(--font-mono); font-size:10.5px; color:#6b7268; display:block; margin-top:3px; text-transform:none; letter-spacing:0; font-weight:400;}

  .exercise{background:var(--card); border:1.5px solid var(--ink); border-radius:3px; padding:16px 20px; margin-bottom:12px;}
  .exercise .q{font-weight:700; margin-bottom:10px; font-size:14px;}
  .options{display:flex; flex-direction:column; gap:8px;}
  .option{display:flex; align-items:center; gap:10px; border:1.5px solid var(--line); border-radius:3px; padding:9px 12px; cursor:pointer; font-size:13.5px;}
  .option:hover{border-color:var(--teal-dark);}
  .option input{accent-color:var(--amber);}
  .option.correct{border-color:var(--good); background:rgba(72,89,43,.12);}
  .option.incorrect{border-color:var(--rust); background:rgba(126,31,31,.10);}
  .exercise-feedback{margin-top:8px; font-size:12.5px; font-weight:700; text-transform:uppercase; letter-spacing:.5px;}
  .exercise-feedback.good{color:var(--good);}
  .exercise-feedback.bad{color:var(--rust);}
  .score-banner{background:var(--navy); color:var(--card); border:1.5px solid var(--ink); border-radius:3px; padding:18px 22px; display:flex; align-items:center;
    justify-content:space-between; margin-top:18px; gap:12px; flex-wrap:wrap;}
  .score-banner .big{font-family:var(--font-display); font-size:24px; font-weight:900;}
  .score-banner .lbl{font-size:11px; text-transform:uppercase; letter-spacing:1.5px; color:var(--amber-light); font-family:var(--font-mono);}

  /* ---- Exam-set list (listening/reading) ---- */
  .set-grid{display:flex; flex-direction:column; gap:12px;}
  .set-card{background:var(--card); border:1.5px solid var(--ink); border-radius:3px; padding:16px 20px; display:flex; align-items:center;
    justify-content:space-between; gap:14px; cursor:pointer; transition:transform .15s ease, box-shadow .15s ease;
    box-shadow:4px 4px 0 rgba(33,31,26,.10);}
  .set-card:hover{transform:translate(-2px,-2px); box-shadow:5px 5px 0 rgba(33,31,26,.16);}
  .set-card .set-title{font-family:var(--font-display); font-size:15.5px; font-weight:800; text-transform:uppercase; letter-spacing:.5px;}
  .set-card .set-meta{font-size:12px; color:#6b7268; margin-top:2px; font-family:var(--font-mono);}
  .set-badge{width:24px;height:24px;border-radius:50%; border:2px solid var(--ink); flex-shrink:0; background:var(--paper-darker);}
  .set-badge.done{background:var(--amber); border-color:var(--ink);}
  .exam-banner{background:var(--navy); color:var(--card); border:1.5px solid var(--ink); border-radius:3px; padding:14px 18px; font-size:12.5px; margin-bottom:20px; display:flex; align-items:center; gap:10px;}
  .exam-banner b{color:var(--amber-light);}

  .reading-text{background:var(--card); border:1.5px solid var(--ink); border-radius:3px; padding:22px 24px; margin-bottom:22px; font-size:15px; line-height:1.75;}
  .reading-text p{margin:0 0 12px;}
  .reading-text p:last-child{margin:0;}

  .listen-box{background:var(--card); border:1.5px solid var(--ink); border-radius:3px; padding:22px 24px; margin-bottom:22px;}
  .listen-controls{display:flex; align-items:center; gap:12px; flex-wrap:wrap; margin-bottom:14px;}
  .listen-status{font-family:var(--font-mono); font-size:12px; color:var(--teal-dark); text-transform:uppercase; letter-spacing:.5px;}
  .transcript{margin-top:16px; padding-top:14px; border-top:1px dashed var(--line); font-size:14px; line-height:1.7; display:none;}
  .transcript.show{display:block;}
  .transcript p{margin:0 0 8px;}
  .tts-warning{background:rgba(126,31,31,.10); border:1.5px solid var(--rust); border-radius:3px; padding:12px 16px; font-size:12.5px; color:var(--rust); margin-bottom:14px;}

  /* ---- Writing module ---- */
  .prompt-grid{display:flex; flex-direction:column; gap:12px; margin-bottom:22px;}
  .prompt-card{background:var(--card); border:1.5px solid var(--ink); border-radius:3px; padding:16px 20px; cursor:pointer;
    transition:transform .15s ease, box-shadow .15s ease;}
  .prompt-card:hover{transform:translate(-2px,-2px); box-shadow:4px 4px 0 rgba(33,31,26,.14);}
  .prompt-card.selected{border-color:var(--amber); border-width:2.5px; box-shadow:3px 3px 0 var(--amber);}
  .prompt-card .p-title{font-family:var(--font-display); font-size:15px; font-weight:800; text-transform:uppercase; letter-spacing:.5px;}
  .prompt-card .p-meta{font-size:11.5px; color:#6b7268; margin-top:3px; font-family:var(--font-mono);}
  .writing-prompt{background:var(--card); border:1.5px solid var(--ink); border-radius:3px; padding:20px 22px; margin-bottom:18px;}
  .writing-prompt h4{margin:0 0 8px; font-family:var(--font-display); font-size:17px; text-transform:uppercase; letter-spacing:.5px;}
  .writing-prompt p{margin:0; font-size:14px;}
  .timer-box{display:flex; align-items:center; gap:14px; background:var(--navy); color:var(--card); border:1.5px solid var(--ink); border-radius:3px; padding:14px 20px; margin-bottom:16px; flex-wrap:wrap;}
  .timer-box .clock{font-family:var(--font-mono); font-size:22px; font-weight:700; color:var(--amber-light);}
  .timer-box .tlbl{font-size:11px; text-transform:uppercase; letter-spacing:1.5px; color:#b8b39e;}
  textarea.writing-area{width:100%; min-height:180px; border:1.5px solid var(--ink); border-radius:3px; padding:14px;
    font-family:var(--font-body); font-size:14px; resize:vertical; background:var(--card); color:var(--ink);}
  textarea.writing-area:focus{outline:2px solid var(--amber); border-color:var(--amber);}
  .word-count{font-family:var(--font-mono); font-size:11.5px; color:#6b7268; margin-top:6px; text-transform:uppercase; letter-spacing:.5px;}
  .word-count.ok{color:var(--good);}
  .action-row{display:flex; gap:12px; flex-wrap:wrap; margin-top:16px;}
  .save-msg{font-size:12.5px; font-weight:700; margin-top:10px; text-transform:uppercase; letter-spacing:.5px;}
  .save-msg.good{color:var(--good);}
  .save-msg.bad{color:var(--rust);}
  .saved-list{margin-top:30px;}
  .saved-item{background:var(--card); border:1.5px solid var(--ink); border-radius:3px; padding:16px 20px; margin-bottom:12px;}
  .saved-item .si-head{display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap;}
  .saved-item .si-title{font-weight:800; font-size:14px; text-transform:uppercase; letter-spacing:.5px;}
  .saved-item .si-meta{font-family:var(--font-mono); font-size:11px; color:#6b7268;}
  .saved-item .si-text{margin-top:10px; font-size:13.5px; white-space:pre-wrap; line-height:1.6;}
  .del-btn{background:var(--card); border:1.5px solid var(--rust); color:var(--rust); border-radius:3px; padding:6px 12px; font-size:11.5px; font-weight:800; cursor:pointer; text-transform:uppercase; letter-spacing:.5px;}
  .del-btn:hover{background:var(--rust); color:#fff;}
  .full-warning{background:rgba(126,31,31,.10); border:1.5px solid var(--rust); border-radius:3px; padding:12px 16px; font-size:12.5px; color:var(--rust); margin-bottom:16px;}

  /* ---- Speaking module ---- */
  .speak-sub-lbl{font-family:var(--font-display); font-size:19px; margin:0 0 6px; text-transform:uppercase; letter-spacing:.5px;}
  .speak-sub-desc{font-size:13px; color:#40453A; margin:0 0 16px; max-width:65ch;}
  .readaloud-card{background:var(--card); border:1.5px solid var(--ink); border-radius:3px; padding:20px 22px; margin-bottom:14px;}
  .readaloud-card .ra-text{font-size:15px; line-height:1.75; margin-bottom:14px;}
  .ra-controls{display:flex; align-items:center; gap:12px; flex-wrap:wrap;}
  .ra-status{font-family:var(--font-mono); font-size:11.5px; color:var(--teal-dark); text-transform:uppercase;}
  .toggle-btn{background:var(--card); border:1.5px solid var(--ink); border-radius:3px; padding:8px 14px; font-size:11.5px; font-weight:700; cursor:pointer; text-transform:uppercase; letter-spacing:.5px;}
  .toggle-btn.on{background:var(--good); border-color:var(--ink); color:#fff;}

  .exam-card{background:var(--card); border:1.5px solid var(--ink); border-radius:3px; padding:28px 26px; max-width:520px; margin:0 auto 18px;
    box-shadow:5px 5px 0 rgba(33,31,26,.14);}
  .exam-card .ec-counter{font-family:var(--font-mono); font-size:11.5px; color:#6b7268; margin-bottom:12px; text-align:center; text-transform:uppercase; letter-spacing:1px;}
  .exam-card .ec-q{font-family:var(--font-display); font-size:18px; font-weight:800; text-align:center; margin-bottom:16px; text-transform:none;}
  .exam-card .ec-tips{display:none; background:var(--paper); border:1px solid var(--line); border-radius:3px; padding:14px 16px; margin-top:10px;}
  .exam-card .ec-tips.show{display:block;}

const MODULES = ["grammar","listening","reading","writing","speaking"];

/* =========================================================
   PROGRESS (localStorage)
   ========================================================= */
const PROGRESS_KEY = "en-passport-progress-v3";
const WRITING_KEY = "en-passport-writing-v3";

function blankLevelProgress(){
  return {
    grammar:{studiedTenses:[], quizBest:{}},
    listening:{completed:[]},
    reading:{completed:[]},
    speaking:{readAloudDone:[], cardsReviewed:false}
  };
}
function loadProgress(){
  try{ const raw = localStorage.getItem(PROGRESS_KEY); if(raw) return JSON.parse(raw); }catch(e){}
  const p = {}; LEVELS.forEach(l=>{ p[l.id] = blankLevelProgress(); }); return p;
}
function saveProgress(){ localStorage.setItem(PROGRESS_KEY, JSON.stringify(progress)); }
let progress = loadProgress();
LEVELS.forEach(l=>{ if(!progress[l.id]) progress[l.id] = blankLevelProgress(); });

function loadWriting(){
  try{ const raw = localStorage.getItem(WRITING_KEY); if(raw) return JSON.parse(raw); }catch(e){}
  const w = {}; LEVELS.forEach(l=>{ w[l.id]=[]; }); return w;
}
function saveWriting(){ localStorage.setItem(WRITING_KEY, JSON.stringify(writingSaves)); }
let writingSaves = loadWriting();
LEVELS.forEach(l=>{ if(!writingSaves[l.id]) writingSaves[l.id] = []; });

function moduleComplete(lvl, key){
  const prog = progress[lvl.id];
  if(key==="grammar") return prog.grammar.studiedTenses.length >= lvl.grammar.tenses.length;
  if(key==="listening") return prog.listening.completed.length >= lvl.listening.length;
  if(key==="reading") return prog.reading.completed.length >= lvl.reading.length;
  if(key==="writing") return writingSaves[lvl.id].length >= 1;
  if(key==="speaking") return prog.speaking.readAloudDone.length >= lvl.speaking.readAloud.length && prog.speaking.cardsReviewed;
  return false;
}
function levelCompletedModules(lvl){ return MODULES.filter(m=>moduleComplete(lvl,m)).length; }
function totalModulesDone(){ let done=0; LEVELS.forEach(l=>{ done+=levelCompletedModules(l); }); return done; }

function updateStatsChip(){
  document.getElementById("statsChip").textContent = totalModulesDone() + " / " + (LEVELS.length*MODULES.length) + " modułów";
}

function goHome(){ stopSpeaking(); state = {view:"levels", levelId:null, module:"grammar"}; render(); }

function render(){
  updateStatsChip();
  if(state.view==="levels") renderLevels();
  else renderLevel();
  window.scrollTo(0,0);
}

function renderLevels(){
  let html = `
    <div class="intro">
      <h2>Twój paszport językowy</h2>
      <p>Dwie ścieżki przygotowania do egzaminu STANAG 6001. Każdy poziom ma pięć modułów odpowiadających sprawnościom egzaminacyjnym: gramatykę, słuchanie, czytanie, pisanie i mówienie. Wszystko działa offline, a Twoje postępy zostają zapisane na tym urządzeniu.</p>
    </div>
    <div class="level-grid">
  `;
  LEVELS.forEach(lvl=>{
    const done = levelCompletedModules(lvl);
    const pct = Math.round((done/MODULES.length)*100);
    html += `
      <div class="level-card" data-level="${lvl.id}" tabindex="0" role="button" aria-label="Otwórz ${lvl.label}">
        <div class="ring" aria-hidden="true"></div>
        <div class="spj">${lvl.code}</div>
        <h3>${lvl.label}</h3>
        <div class="cefr">${lvl.subtitle} &middot; ${lvl.cefr}</div>
        <p class="desc">${lvl.desc}</p>
        <div class="lvl-progress">
          <div class="lvl-bar"><div class="lvl-bar-fill" style="width:${pct}%;"></div></div>
          <div class="pct">${done}/5</div>
        </div>
      </div>
    `;
  });
  html += `</div><div class="reset-row"><button class="link-btn" id="resetBtn">Wyczyść wszystkie postępy i zapisane teksty</button></div>`;
  mainEl.innerHTML = html;
  mainEl.querySelectorAll(".level-card").forEach(card=>{
    card.addEventListener("click", ()=> openLevel(card.dataset.level));
    card.addEventListener("keydown", e=>{ if(e.key==="Enter") openLevel(card.dataset.level); });
  });
  document.getElementById("resetBtn").addEventListener("click", ()=>{
    if(confirm("Na pewno wyczyścić wszystkie zapisane postępy i teksty?")){
      progress = {}; LEVELS.forEach(l=>{ progress[l.id]=blankLevelProgress(); }); saveProgress();
      writingSaves = {}; LEVELS.forEach(l=>{ writingSaves[l.id]=[]; }); saveWriting();
      render();
    }
  });
}
function openLevel(levelId){ state = {view:"level", levelId, module:"grammar"}; render(); }

function renderLevel(){
  stopSpeaking();
  const lvl = LEVELS.find(l=>l.id===state.levelId);
  let html = `
    <div class="crumbs"><button id="crumbHome">Poziomy</button> <span>/</span> <span>${lvl.label}</span></div>
    <div class="module-header">
      <div class="eyebrow">${lvl.code} &middot; ${lvl.cefr}</div>
      <h2>${lvl.label} — ${lvl.subtitle}</h2>
    </div>
    <div class="tabs">
      ${MODULES.map(m=>`
        <button class="tab-btn ${state.module===m?"active":""}" data-mod="${m}">
          <span class="tab-dot ${moduleComplete(lvl,m)?"done":""}"></span> ${MODULE_LABELS[m]}
        </button>
      `).join("")}
    </div>
    <div id="modPanel"></div>
  `;
  mainEl.innerHTML = html;
  document.getElementById("crumbHome").addEventListener("click", goHome);
  mainEl.querySelectorAll(".tab-btn").forEach(btn=>{
    btn.addEventListener("click", ()=>{ stopSpeaking(); state.module = btn.dataset.mod; render(); });
  });
  const panel = document.getElementById("modPanel");
  if(state.module==="grammar") renderGrammarModule(panel, lvl);
  else if(state.module==="listening") renderExamListModule(panel, lvl, "listening");
  else if(state.module==="reading") renderExamListModule(panel, lvl, "reading");
  else if(state.module==="writing") renderWritingModule(panel, lvl);
  else if(state.module==="speaking") renderSpeakingModule(panel, lvl);
}

   ========================================================= */

  const g = lvl.grammar;
  let html = `<div class="section-lbl">Materiał — czasy na ${lvl.label}</div>`;
  g.tenses.forEach(t=>{
    const studied = progress[lvl.id].grammar.studiedTenses.includes(t.id);
    html += `
      <div class="tense-card">
        <div class="tense-head">
          <h4>${t.name} <span class="pl">(${t.namePl})</span></h4>
          <button class="small-btn" data-mark-tense="${t.id}">${studied ? "Przerobione ✓" : "Oznacz jako przerobione"}</button>
        </div>
        <div class="tense-block-lbl">Kiedy używamy</div>
        <ul class="usage-list">${t.usage.map(u=>`<li>${u}</li>`).join("")}</ul>
        <div class="tense-block-lbl">Budowa zdania</div>
        <table class="struct-table">
          <tr><td>Twierdzenie</td><td><div class="formula">${t.structure.affirmative.formula}</div><div class="ex">${t.structure.affirmative.example}</div></td></tr>
          <tr><td>Przeczenie</td><td><div class="formula">${t.structure.negative.formula}</div><div class="ex">${t.structure.negative.example}</div></td></tr>
          <tr><td>Pytanie</td><td><div class="formula">${t.structure.question.formula}</div><div class="ex">${t.structure.question.example}</div></td></tr>
        </table>
        <div class="tense-block-lbl">Zwroty sygnałowe</div>
        <div class="tag-list">${t.signalWords.map(s=>`<span class="tag-chip">${s}</span>`).join("")}</div>
        <div class="tense-block-lbl">Przydatne zwroty</div>
        <ul class="phrase-mini">${t.usefulPhrases.map(p=>`<li>${p}</li>`).join("")}</ul>
      </div>
    `;
  });

  html += `<div class="section-lbl">Słownictwo — stopnie wojskowe</div>
    <div class="ref-table-wrap"><table class="ref-table"><thead><tr><th>English</th><th>Polski</th></tr></thead><tbody>
      ${RANKS.map(r=>`<tr><td>${r.en}</td><td>${r.pl}</td></tr>`).join("")}
    </tbody></table></div>`;

  html += `<div class="section-lbl">Słownictwo — życie codzienne</div>`;
  EVERYDAY_VOCAB.forEach(cat=>{
    html += `<div class="vocab-cat"><h5>${cat.category}</h5><div class="vocab-chips">
      ${cat.items.map(i=>`<span class="vocab-chip"><b>${i.en}</b> — ${i.pl}</span>`).join("")}
    </div></div>`;
  });

  const verbList = lvl.id==="p1" ? IRREGULAR_CORE : IRREGULAR_CORE.concat(IRREGULAR_EXTRA);
  html += `<div class="section-lbl">Czasowniki nieregularne — niezbędne minimum</div>
    <div class="ref-table-wrap"><table class="ref-table"><thead><tr><th>Base</th><th>Past</th><th>Participle</th><th>Polski</th></tr></thead><tbody>
      ${verbList.map(v=>`<tr><td>${v.base}</td><td>${v.past}</td><td>${v.part}</td><td>${v.pl}</td></tr>`).join("")}
    </tbody></table></div>`;

  html += `<div class="section-lbl">Quiz gramatyczny</div>
    <p style="font-size:13.5px;color:#5a6259;margin:0 0 14px;">Wybierz temat — quiz wylosuje 10 pytań. Możesz powtarzać dowolną liczbę razy.</p>
    <div class="quiz-topic-btns" id="quizTopicBtns">
      <button class="quiz-topic-btn" data-topic="__general__">Quiz ogólny
        ${progress[lvl.id].grammar.quizBest.__general__!==undefined ? `<span class="quiz-best">najlepszy wynik: ${progress[lvl.id].grammar.quizBest.__general__}%</span>` : ""}
      </button>
      ${g.tenses.map(t=>`
        <button class="quiz-topic-btn" data-topic="${t.id}">${t.name}
          ${progress[lvl.id].grammar.quizBest[t.id]!==undefined ? `<span class="quiz-best">najlepszy wynik: ${progress[lvl.id].grammar.quizBest[t.id]}%</span>` : ""}
        </button>
      `).join("")}
    </div>
    <div id="grammarQuizArea"></div>
  `;

  panel.innerHTML = html;

  panel.querySelectorAll("[data-mark-tense]").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      const tid = btn.dataset.markTense;
      const arr = progress[lvl.id].grammar.studiedTenses;
      if(!arr.includes(tid)){ arr.push(tid); saveProgress(); showStamp(lvl, "grammar", "Materiał: "+tid); }

  panel.querySelectorAll(".quiz-topic-btn").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      panel.querySelectorAll(".quiz-topic-btn").forEach(b=>b.classList.remove("active"));
      btn.classList.add("active");
      startGrammarQuiz(lvl, btn.dataset.topic);
    });
  });

function shuffleArr(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){ const j = Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}

function startGrammarQuiz(lvl, topic){
  const area = document.getElementById("grammarQuizArea");
  const pool = topic==="__general__" ? lvl.grammar.quizBank : lvl.grammar.quizBank.filter(q=>q.topic===topic);
  const picked = shuffleArr(pool).slice(0,10);
  const topicName = topic==="__general__" ? "Quiz ogólny" : lvl.grammar.tenses.find(t=>t.id===topic).name;

  let html = `<div class="section-lbl">${topicName} — 10 pytań</div><div id="gqList"></div>
    <button class="primary-btn" id="submitGQuiz">Zakończ quiz</button>
    <div id="gqResult"></div>`;
  area.innerHTML = html;
  const list = document.getElementById("gqList");
  picked.forEach((ex,i)=>{
    const block = document.createElement("div");
    block.className = "exercise";
    block.innerHTML = `
      <div class="q">${i+1}. ${ex.q}</div>
      <div class="options">
        ${ex.options.map((opt,oi)=>`
          <label class="option" data-ex="${i}" data-opt="${oi}">
            <input type="radio" name="gq${i}" value="${oi}"> ${opt}
          </label>
        `).join("")}
      </div>
    `;
    list.appendChild(block);
  });
  document.getElementById("submitGQuiz").addEventListener("click", ()=>{
    let correct = 0;
    picked.forEach((ex,i)=>{
      const selected = list.querySelector(`input[name="gq${i}"]:checked`);
      const opts = list.querySelectorAll(`.option[data-ex="${i}"]`);
      opts.forEach(o=>o.classList.remove("correct","incorrect"));
      const correctOpt = list.querySelector(`.option[data-ex="${i}"][data-opt="${ex.answer}"]`);
      if(selected && parseInt(selected.value,10)===ex.answer){ correct++; correctOpt.classList.add("correct"); }
      else{ if(selected) selected.closest(".option").classList.add("incorrect"); correctOpt.classList.add("correct"); }
    });
    const pct = Math.round((correct/picked.length)*100);
    const key = topic;
    const prevBest = progress[lvl.id].grammar.quizBest[key];
    if(prevBest===undefined || pct>prevBest){ progress[lvl.id].grammar.quizBest[key] = pct; saveProgress(); }
    document.getElementById("gqResult").innerHTML = `
      <div class="score-banner">
        <div><div class="lbl">Wynik</div><div class="big">${correct} / ${picked.length} (${pct}%)</div></div>
        <button class="ghost-btn" id="retryGQuiz">Losuj ponownie</button>
      </div>
    `;
    document.getElementById("retryGQuiz").addEventListener("click", ()=> startGrammarQuiz(lvl, topic));
  });
}

function openExamSet(panel, lvl, kind, setId){
  stopSpeaking();
  const set = lvl[kind].find(s=>s.id===setId);
  const backBtn = `<button class="ghost-btn" id="backToSets" style="margin-bottom:18px;">&larr; Wróć do listy zestawów</button>`;
  if(kind==="reading"){
    panel.innerHTML = `
      ${backBtn}
      <div class="reading-text">${set.text.map(p=>`<p>${p}</p>`).join("")}</div>
      <div id="setQList"></div>
      <button class="primary-btn" id="checkSet">Sprawdź odpowiedzi</button>
      <div id="setResult"></div>
    `;
  } else {
    const ttsSupported = "speechSynthesis" in window;
    panel.innerHTML = `
      ${backBtn}
      ${!ttsSupported ? `<div class="tts-warning">Ta przeglądarka nie obsługuje syntezy mowy. Skorzystaj z transkrypcji poniżej.</div>` : ""}
      <div class="listen-box">
        <div class="listen-controls">
          <button class="primary-btn" id="playBtn" ${!ttsSupported?"disabled":""}>▶ Odsłuchaj nagranie</button>
          <button class="icon-btn" id="stopBtn" ${!ttsSupported?"disabled":""} aria-label="Zatrzymaj">■</button>
          <span class="listen-status" id="listenStatus">${ttsSupported ? "Gotowe do odtworzenia" : "Synteza mowy niedostępna"}</span>
        </div>
        <button class="link-btn" id="toggleTranscript">Pokaż / ukryj transkrypcję</button>
        <div class="transcript" id="transcript">${set.transcript.map(l=>`<p>${l}</p>`).join("")}</div>
      </div>
      <div id="setQList"></div>
      <button class="primary-btn" id="checkSet">Sprawdź odpowiedzi</button>
      <div id="setResult"></div>
    `;
    document.getElementById("toggleTranscript").addEventListener("click", ()=>{
      document.getElementById("transcript").classList.toggle("show");
    });
    if(ttsSupported){
      document.getElementById("playBtn").addEventListener("click", ()=>{
        stopSpeaking();
        const fullText = set.transcript.join(". ").replace(/\s+/g," ");
        const utter = new SpeechSynthesisUtterance(fullText);
        utter.lang = "en-US";
        const voice = pickEnglishVoice();
        if(voice) utter.voice = voice;
        utter.rate = 0.95;
        utter.onstart = ()=>{ document.getElementById("listenStatus").textContent = "Odtwarzanie..."; };
        utter.onend = ()=>{ document.getElementById("listenStatus").textContent = "Zakończono"; };
        utter.onerror = ()=>{ document.getElementById("listenStatus").textContent = "Błąd odtwarzania"; };
        window.speechSynthesis.speak(utter);
      });
      document.getElementById("stopBtn").addEventListener("click", ()=>{
        stopSpeaking();
        document.getElementById("listenStatus").textContent = "Zatrzymano";
      });
    }
  }
  document.getElementById("backToSets").addEventListener("click", ()=>{ stopSpeaking(); renderExamListModule(panel, lvl, kind); });

  const qList = document.getElementById("setQList");
  set.questions.forEach((ex,i)=>{
    const block = document.createElement("div");
    block.className = "exercise";
    block.innerHTML = `
      <div class="q">${i+1}. ${ex.q}</div>
      <div class="options">
        ${ex.options.map((opt,oi)=>`
          <label class="option" data-ex="${i}" data-opt="${oi}">
            <input type="radio" name="sq${i}" value="${oi}"> ${opt}
          </label>
        `).join("")}
      </div>
      <div class="exercise-feedback" id="fb-s-${i}"></div>
    `;
    qList.appendChild(block);
  });
  document.getElementById("checkSet").addEventListener("click", ()=>{
    let correct = 0;
    set.questions.forEach((ex,i)=>{
      const selected = qList.querySelector(`input[name="sq${i}"]:checked`);
      const fb = document.getElementById(`fb-s-${i}`);
      const opts = qList.querySelectorAll(`.option[data-ex="${i}"]`);
      opts.forEach(o=>o.classList.remove("correct","incorrect"));
      if(!selected){ fb.textContent = "Brak odpowiedzi."; fb.className="exercise-feedback bad"; return; }
      const val = parseInt(selected.value,10);
      const correctOpt = qList.querySelector(`.option[data-ex="${i}"][data-opt="${ex.answer}"]`);
      if(val===ex.answer){ correct++; fb.textContent="Dobrze! ✓"; fb.className="exercise-feedback good"; correctOpt.classList.add("correct"); }
      else{ fb.textContent="Niepoprawnie. Poprawna odpowiedź: "+ex.options[ex.answer]; fb.className="exercise-feedback bad"; selected.closest(".option").classList.add("incorrect"); correctOpt.classList.add("correct"); }
    });
    const pct = Math.round((correct/set.questions.length)*100);
    document.getElementById("setResult").innerHTML = `
      <div class="score-banner">
        <div><div class="lbl">Wynik</div><div class="big">${correct} / ${set.questions.length} (${pct}%)</div></div>
        <button class="ghost-btn" id="markSetDone">${progress[lvl.id][kind].completed.includes(setId) ? "Ukończono ✓" : "Oznacz zestaw jako ukończony"}</button>
      </div>
    `;
    document.getElementById("markSetDone").addEventListener("click", ()=>{
      if(!progress[lvl.id][kind].completed.includes(setId)){
        progress[lvl.id][kind].completed.push(setId);
        saveProgress();
        showStamp(lvl, kind, set.title);
      }
    });
  });
}

/* =========================================================
   WRITING MODULE (exam prompts + timer + saved texts, max 2)
   ========================================================= */
let writingTimerInterval = null;
function renderWritingModule(panel, lvl){
  const prompts = lvl.writing.prompts;
  let selectedPromptId = prompts[0].id;

  function draw(){
    clearInterval(writingTimerInterval);
    const prompt = prompts.find(p=>p.id===selectedPromptId);
    const saved = writingSaves[lvl.id];
    const atLimit = saved.length >= 2;

    let html = `
      <div class="exam-banner">✍️ <span>Zadania pisemne w formacie egzaminacyjnym STANAG — limit czasu i liczby słów jak na egzaminie.</span></div>
      <div class="prompt-grid">
        ${prompts.map(p=>`
          <div class="prompt-card ${p.id===selectedPromptId?"selected":""}" data-prompt="${p.id}">
            <div class="p-title">${p.title}</div>
            <div class="p-meta">${p.timeLimitMin} min &middot; ${p.wordTarget}</div>
          </div>
        `).join("")}
      </div>
      <div class="writing-prompt">
        <h4>${prompt.title}</h4>
        <p>${prompt.instructions}</p>
      </div>
      <div class="timer-box">
        <div><div class="tlbl">Czas na zadanie</div><div class="clock" id="clockDisplay">${String(prompt.timeLimitMin).padStart(2,"0")}:00</div></div>
        <button class="ghost-btn" id="startTimerBtn" style="border-color:var(--amber-light); color:var(--amber-light);">Rozpocznij odliczanie</button>
        <span class="listen-status" id="timerStatus" style="color:#c9c2b0;"></span>
      </div>
      <textarea class="writing-area" id="writingArea" placeholder="Napisz swoją odpowiedź tutaj...">${draftText||""}</textarea>
      <div class="word-count" id="wordCount">0 słów &middot; cel: ${prompt.wordTarget}</div>
      ${atLimit ? `<div class="full-warning">Masz już zapisane 2 teksty w tym module. Usuń jeden z zapisanych tekstów poniżej, aby zapisać nowy.</div>` : ""}
      <div class="action-row">
        <button class="primary-btn" id="saveWritingBtn" ${atLimit?"disabled":""}>Zapisz tekst</button>
      </div>
      <div class="save-msg" id="saveMsg"></div>
      <div class="saved-list">
        <div class="section-lbl">Zapisane teksty (${saved.length}/2)</div>
        ${saved.length===0 ? `<p style="font-size:13.5px;color:#8a8579;">Brak zapisanych tekstów.</p>` : saved.map(s=>`
          <div class="saved-item">
            <div class="si-head">
              <div><div class="si-title">${s.promptTitle}</div><div class="si-meta">${s.words} słów &middot; ${s.date}</div></div>
              <button class="del-btn" data-del="${s.id}">Usuń</button>
            </div>
            <div class="si-text">${s.text}</div>
          </div>
        `).join("")}
      </div>
    `;
    panel.innerHTML = html;

    panel.querySelectorAll(".prompt-card").forEach(card=>{
      card.addEventListener("click", ()=>{ selectedPromptId = card.dataset.prompt; draftText=""; draw(); });
    });

    const area = document.getElementById("writingArea");
    let draftLocal = area.value;
    area.addEventListener("input", ()=>{
      draftText = area.value;
      const words = area.value.trim().length ? area.value.trim().split(/\s+/).length : 0;
      const wc = document.getElementById("wordCount");
      wc.textContent = words + " słów · cel: " + prompt.wordTarget;
    });

    document.getElementById("startTimerBtn").addEventListener("click", ()=>{
      clearInterval(writingTimerInterval);
      let remaining = prompt.timeLimitMin*60;
      const clockEl = document.getElementById("clockDisplay");
      const statusEl = document.getElementById("timerStatus");
      statusEl.textContent = "Odliczanie trwa...";
      writingTimerInterval = setInterval(()=>{
        remaining--;
        const mm = String(Math.floor(remaining/60)).padStart(2,"0");
        const ss = String(remaining%60).padStart(2,"0");
        clockEl.textContent = mm+":"+ss;
        if(remaining<=0){
          clearInterval(writingTimerInterval);
          statusEl.textContent = "Czas minął — dokończ zdanie i zapisz tekst.";
        }
      },1000);
    });

    document.getElementById("saveWritingBtn").addEventListener("click", ()=>{
      const text = area.value.trim();
      const msg = document.getElementById("saveMsg");
      if(!text){ msg.textContent = "Napisz najpierw tekst, zanim go zapiszesz."; msg.className="save-msg bad"; return; }
      if(writingSaves[lvl.id].length>=2){ msg.textContent = "Limit 2 zapisanych tekstów osiągnięty — usuń jeden, aby zapisać nowy."; msg.className="save-msg bad"; return; }
      const words = text.split(/\s+/).length;
      writingSaves[lvl.id].push({
        id: "w"+Date.now(), promptId: prompt.id, promptTitle: prompt.title, text: text, words: words,
        date: new Date().toLocaleDateString("pl-PL")
      });
      saveWriting();
      draftText = "";
      showStamp(lvl, "writing", prompt.title);
      draw();
    });

    panel.querySelectorAll("[data-del]").forEach(btn=>{
      btn.addEventListener("click", ()=>{
        writingSaves[lvl.id] = writingSaves[lvl.id].filter(s=>s.id!==btn.dataset.del);
        saveWriting();
        draw();
      });
    });
  }
  let draftText = "";
  draw();
}

/* =========================================================
   SPEAKING MODULE (read-aloud + exam cue cards)
   ========================================================= */
function renderSpeakingModule(panel, lvl){
  const s = lvl.speaking;
  let html = `
    <h3 class="speak-sub-lbl">Czytanie na głos</h3>
    <p class="speak-sub-desc">Odsłuchaj wzorcową wymowę, a potem przeczytaj tekst na głos. To pomaga przełamać barierę mówienia po angielsku.</p>
  `;
  s.readAloud.forEach(t=>{
    const done = progress[lvl.id].speaking.readAloudDone.includes(t.id);
    html += `
      <div class="readaloud-card">
        <div class="p-title" style="font-family:var(--font-display);font-size:16.5px;font-weight:700;margin-bottom:8px;">${t.title}</div>
        <div class="ra-text">${t.text}</div>
        <div class="ra-controls">
          <button class="small-btn" data-play="${t.id}">▶ Odsłuchaj wzór</button>
          <span class="ra-status" id="raStatus-${t.id}"></span>
          <button class="toggle-btn ${done?"on":""}" data-read="${t.id}">${done ? "Przeczytane ✓" : "Oznacz jako przeczytane"}</button>
        </div>
      </div>
    `;
  });

  html += `
    <h3 class="speak-sub-lbl" style="margin-top:34px;">Fiszki egzaminacyjne</h3>
    <p class="speak-sub-desc">Zestaw pytań do wykorzystania na zajęciach — nauczyciel zadaje pytanie, uczeń odpowiada ustnie. Wskazówki pomagają ocenić odpowiedź.</p>
    <div id="examCardArea"></div>
  `;
  panel.innerHTML = html;

  panel.querySelectorAll("[data-play]").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      stopSpeaking();
      const item = s.readAloud.find(x=>x.id===btn.dataset.play);
      const statusEl = document.getElementById("raStatus-"+item.id);
      if(!("speechSynthesis" in window)){ statusEl.textContent = "Synteza mowy niedostępna"; return; }
      const utter = new SpeechSynthesisUtterance(item.text);
      utter.lang = "en-US";
      const voice = pickEnglishVoice();
      if(voice) utter.voice = voice;
      utter.rate = 0.9;
      utter.onstart = ()=>{ statusEl.textContent = "Odtwarzanie..."; };
      utter.onend = ()=>{ statusEl.textContent = "Twoja kolej — przeczytaj na głos!"; };
      window.speechSynthesis.speak(utter);
    });
  });
  panel.querySelectorAll("[data-read]").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      const id = btn.dataset.read;
      const arr = progress[lvl.id].speaking.readAloudDone;
      if(!arr.includes(id)){ arr.push(id); saveProgress(); }
      else { progress[lvl.id].speaking.readAloudDone = arr.filter(x=>x!==id); saveProgress(); }
      renderSpeakingModule(panel, lvl);
    });
  });

  drawExamCards(panel, lvl);
}

function drawExamCards(panel, lvl){
  const cards = lvl.speaking.examCards;
  let idx = 0;
  const seen = new Set();
  const area = document.getElementById("examCardArea");

  function draw(){
    seen.add(idx);
    const allSeen = seen.size >= cards.length;
    const c = cards[idx];
    area.innerHTML = `
      <div class="exam-card">
        <div class="ec-counter">Pytanie ${idx+1} z ${cards.length}</div>
        <div class="ec-q">${c.q}</div>
        <div style="text-align:center;"><button class="small-btn" id="toggleTips">Pokaż / ukryj wskazówki</button></div>
        <div class="ec-tips" id="ecTips">
          <div class="ec-tips-lbl">Wskazówki / kluczowe zwroty</div>
          <ul>${c.tips.map(t=>`<li>${t}</li>`).join("")}</ul>
        </div>
      </div>
      <div class="ec-nav">
        <button class="icon-btn" id="prevCard" ${idx===0?"disabled":""} aria-label="Poprzednia">&larr;</button>
        <button class="icon-btn" id="nextCard" ${idx===cards.length-1?"disabled":""} aria-label="Następna">&rarr;</button>
      </div>
      <div class="action-row" style="justify-content:center;margin-top:18px;">
        <button class="primary-btn" id="markCardsDone" ${!allSeen?"disabled":""}>
          ${progress[lvl.id].speaking.cardsReviewed ? "Fiszki przerobione ✓" : "Oznacz fiszki jako przerobione"}
        </button>
      </div>
    `;
    document.getElementById("toggleTips").addEventListener("click", ()=>{
      document.getElementById("ecTips").classList.toggle("show");
    });
    document.getElementById("prevCard").addEventListener("click", ()=>{ if(idx>0){ idx--; draw(); } });
    document.getElementById("nextCard").addEventListener("click", ()=>{ if(idx<cards.length-1){ idx++; draw(); } });
    document.getElementById("markCardsDone").addEventListener("click", ()=>{
      if(!progress[lvl.id].speaking.cardsReviewed){
        progress[lvl.id].speaking.cardsReviewed = true;
        saveProgress();
        showStamp(lvl, "speaking", "Fiszki egzaminacyjne");
      }
    });
  }
  draw();
}

/* =========================================================
   SPEECH SYNTHESIS (offline TTS helpers)
   ========================================================= */
function stopSpeaking(){ if(window.speechSynthesis){ window.speechSynthesis.cancel(); } }
function pickEnglishVoice(){
  const voices = window.speechSynthesis ? window.speechSynthesis.getVoices() : [];
  return voices.find(v=>v.lang && v.lang.startsWith("en")) || voices[0] || null;
}
if("speechSynthesis" in window){ window.speechSynthesis.onvoiceschanged = ()=>{}; }

/* =========================================================
   STAMP ANIMATION
   ========================================================= */
function showStamp(lvl, moduleKey, detail){
  const overlay = document.getElementById("stampOverlay");
  document.getElementById("stampUnitLabel").textContent = lvl.code;
  document.getElementById("stampSectionLabel").textContent = (MODULE_LABELS[moduleKey]||moduleKey).toUpperCase();
  document.getElementById("stampCaption").textContent = "Kliknij, aby kontynuować";
  overlay.classList.add("show");
  const close = ()=>{ overlay.classList.remove("show"); overlay.removeEventListener("click", close); render(); };
  overlay.addEventListener("click", close);
  setTimeout(()=>{ if(overlay.classList.contains("show")) close(); }, 1800);
}

/* =========================================================
   INIT
   ========================================================= */
render();
</script>
</body>
</html>
